# Specification only: register edges only after objects and job runs exist.
subject: synthetic_oil_production_and_downtime
units: {oil: tonne, duration: hour, time: UTC}
owner: TO_BE_ASSIGNED
sources:
  - {id: generator, kind: service, description: deterministic synthetic source}
  - {id: oil.events.v1, kind: kafka_topic, description: versioned field/well/production/downtime events}
transforms:
  - {id: gp_sink, inputs: [oil.events.v1], outputs: [oil_stg.event_log, oil_stg.kafka_checkpoint], status: planned}
  - {id: oil_dds.apply_batch, inputs: [oil_stg.event_log, oil_stg.batch_control], outputs: [oil_dds.event, oil_dds.hub_field, oil_dds.hub_well, oil_dds.hub_production_day, oil_dds.hub_downtime, oil_dds.link_well_field, oil_dds.link_production_day_well, oil_dds.link_downtime_well, oil_dds.sat_field, oil_dds.sat_well, oil_dds.sat_daily_production, oil_dds.sat_downtime]}
  - id: oil_mart.refresh_production
    inputs: [oil_dds.sat_field, oil_dds.sat_well, oil_dds.link_well_field, oil_dds.sat_daily_production, oil_dds.link_production_day_well]
    outputs: [oil_mart.dim_field, oil_mart.dim_well, oil_mart.fact_well_day, oil_mart.agg_field_day]
  - id: oil_mart.refresh_downtime
    inputs: [oil_dds.sat_downtime, oil_dds.link_downtime_well, oil_mart.fact_well_day]
    outputs: [oil_mart.dim_downtime_reason, oil_mart.fact_downtime_interval, oil_mart.agg_field_downtime_day]
  - {id: production_view, inputs: [oil_mart.agg_field_day], outputs: [oil_mart.v_field_production]}
  - {id: performance_view, inputs: [oil_mart.agg_field_day, oil_mart.agg_field_downtime_day], outputs: [oil_mart.v_field_performance]}
  - {id: superset_production, inputs: [oil_mart.v_field_production], outputs: [dashboard_production], status: planned}
  - {id: superset_performance, inputs: [oil_mart.v_field_performance], outputs: [dashboard_performance], status: planned}
migration:
  wave_1: [field, well, production_day, oil_mart.v_field_production]
  wave_2: [downtime, oil_mart.v_field_performance]
  warning: shared_dimensions_may_be_reused_but_must_not_be_reloaded_without_consistent_cut
